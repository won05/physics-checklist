<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>물리 기출 진도 체크리스트</title>
<style>
  :root {
    --u0: #1f5fa8; --u1: #b4531a; --u2: #6a3fa8;
    --ok: #1e8a3e; --ok-bg: #e3f5e8;
    --no: #c62828; --no-bg: #fde7e7;
    --line: #dde1e6; --muted: #6b7280; --bg: #f5f6f8; --card: #fff;
    --unit: var(--u0);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
         background: var(--bg); color: #1f2328; font-size: 17px; line-height: 1.45; }
  button, input { font: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 12px 12px 80px; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  header { flex-wrap: nowrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1 1 0; min-width: 0; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--no); font-weight: 600; }
  .iconbtn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; min-height: 44px; cursor: pointer; }
  .demo-banner { background: #fff7d6; border: 1px solid #f0d77a; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; }

  .viewtabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .viewtabs button { flex: 1; min-height: 48px; border: 1px solid var(--line); background: #fff; border-radius: 12px;
                     font-weight: 700; cursor: pointer; font-size: 17px; }
  .viewtabs button.on { background: #1f2328; color: #fff; border-color: #1f2328; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 17px; margin: 0 0 10px; }

  .bar-row { margin: 8px 0; }
  .bar-label { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; margin-bottom: 4px; flex-wrap: wrap; }
  .bar-label b { font-weight: 700; }
  .bar { height: 14px; background: #eceff3; border-radius: 7px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 7px; transition: width .3s; }
  .total .bar { height: 20px; border-radius: 10px; }
  .unk-chip { color: var(--no); font-weight: 700; white-space: nowrap; }
  .ok-text { color: var(--ok); font-weight: 700; white-space: nowrap; }

  .unittabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .unittabs button { flex: 1; min-height: 52px; border-radius: 12px; border: 2px solid; background: #fff; font-weight: 700;
                     cursor: pointer; font-size: 16px; padding: 4px; line-height: 1.2; }
  .unittabs button small { display: block; font-weight: 500; font-size: 13px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button { min-height: 44px; padding: 6px 14px; border-radius: 22px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
  .filters button.on { background: var(--unit); color: #fff; border-color: var(--unit); }

  details.std { margin-bottom: 10px; }
  details.std summary { cursor: pointer; font-weight: 700; padding: 6px 0; min-height: 40px; }
  .std-row { padding: 6px 0; border-top: 1px dashed var(--line); }
  .std-row:first-of-type { border-top: 0; }
  .std-code { color: var(--muted); font-size: 12px; }

  table.items { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  table.items th { background: var(--unit); color: #fff; font-size: 14px; padding: 10px 6px; text-align: left; white-space: nowrap; }
  table.items td { border-top: 1px solid var(--line); padding: 6px; vertical-align: middle; }
  table.items tr.hl td { animation: hl 2s ease-out; }
  @keyframes hl { from { background: #fff3a8; } to { background: transparent; } }
  td.num { font-weight: 700; width: 48px; text-align: center; color: var(--unit); font-size: 18px; }
  td.kw { min-width: 120px; }
  td.src { font-size: 14px; color: #374151; }
  td.src .new { color: var(--muted); font-style: italic; }
  .tog { width: 52px; height: 48px; border-radius: 12px; border: 2px solid; background: #fff; cursor: pointer;
         font-size: 22px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
  .tog.ok { border-color: #9fd3ae; color: #b7c4bb; }
  .tog.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .tog.no { border-color: #f1aaaa; color: #d8b9b9; }
  .tog.no.on { background: var(--no); border-color: var(--no); color: #fff; }
  .tog-label { display: none; }
  input.date { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; width: 150px; background: #fff; }
  input.memo { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; width: 100%; min-width: 140px; }
  tr.is-ok td.num { background: var(--ok-bg); }
  tr.is-no td.num { background: var(--no-bg); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* 통계 */
  table.stat { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.stat th, table.stat td { border-bottom: 1px solid var(--line); padding: 9px 6px; text-align: right; }
  table.stat th:first-child, table.stat td:first-child { text-align: left; }
  table.stat th { background: #f0f2f5; font-size: 14px; }
  table.stat tr.sum td { font-weight: 800; border-top: 2px solid #1f2328; background: #fafbfc; }
  .unit-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .stat-unit h3 { margin: 0 0 8px; font-size: 17px; }
  .numlinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .numlinks button { min-width: 48px; min-height: 44px; border-radius: 10px; border: 2px solid var(--no); background: var(--no-bg);
                     color: var(--no); font-weight: 800; cursor: pointer; font-size: 16px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* 로그인 */
  .login { max-width: 380px; margin: 60px auto; }
  .login input { width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: 18px; }
  .login button.main { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #1f2328; color: #fff; font-weight: 700; font-size: 18px; cursor: pointer; }
  .msg { color: var(--no); min-height: 24px; font-size: 15px; }

  /* 휴대폰: 표를 카드처럼 */
  @media (max-width: 680px) {
    body { font-size: 17px; }
    table.items, table.items tbody { display: block; border: 0; background: transparent; }
    table.items thead { display: none; }
    table.items tr { display: grid; grid-template-columns: 44px 1fr 56px 56px; grid-template-areas:
        "num kw ok no" "num src ok no" "date date date date" "memo memo memo memo";
      gap: 4px 8px; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--unit);
      border-radius: 12px; padding: 10px; margin-bottom: 8px; align-items: center; }
    table.items td { border: 0; padding: 0; }
    td.num { grid-area: num; width: auto; font-size: 20px; border-radius: 8px; align-self: stretch; display: flex; align-items: center; justify-content: center; }
    td.kw { grid-area: kw; font-weight: 600; min-width: 0; }
    td.src { grid-area: src; font-size: 13px; }
    td.ok { grid-area: ok; } td.no { grid-area: no; }
    td.ok, td.no { text-align: center; }
    .tog-label { display: block; font-size: 12px; text-align: center; margin-top: 2px; }
    td.date { grid-area: date; } td.memo { grid-area: memo; }
    td.date, td.memo { margin-top: 6px; }
    input.date { width: 100%; }
    input.memo { min-width: 0; }
    tr:not(.is-ok) td.date:has(input[value=""]) { display: none; }  /* 휴대폰: 해결 전엔 날짜 칸 숨김 */
    table.stat { font-size: 14px; }
    table.stat th, table.stat td { padding: 8px 4px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">불러오는 중…</p></div>

<script>
// ===== 설정 (공개해도 되는 값입니다. 비밀번호는 서버에서만 확인합니다) =====
const SUPABASE_URL = "https://lluoniylyjgfyfnpxzto.supabase.co";
const SUPABASE_KEY = "sb_publishable_lAi4pXxfJuVdibfajFK4MQ_0I5PUyJs";
const UNIT_COLORS = ["#1f5fa8", "#b4531a", "#6a3fa8"];
const POLL_MS = 8000;
const DEMO = new URLSearchParams(location.search).has("demo");
const PW_KEY = "physics_pw";

let DATA = null;            // checklist_data.json 내용 그대로
let prog = {};              // item_id -> {solved, unknown, solved_date, memo}
let pending = {};           // 저장 중인 문항
let pw = localStorage.getItem(PW_KEY) || "";
let view = "list", unitIdx = 0, filter = "all";
let pollTimer = null;

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const P = id => prog[id] || { solved: false, unknown: false, solved_date: null, memo: "" };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

// ===== 서버 통신 =====
async function rpc(name, args) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  const txt = await r.text();
  if (!r.ok) { const e = new Error(txt); e.status = r.status; e.wrongPw = txt.includes("wrong password"); throw e; }
  return txt ? JSON.parse(txt) : null;
}
const demoStore = {
  load() { try { return JSON.parse(localStorage.getItem("physics_demo") || "{}"); } catch { return {}; } },
  save(p) { localStorage.setItem("physics_demo", JSON.stringify(p)); }
};
async function fetchAll() {
  if (DEMO) return demoStore.load();
  const rows = await rpc("physics_get_all", { pw });
  const m = {};
  for (const r of rows) m[r.item_id] = { solved: r.solved, unknown: r.unknown, solved_date: r.solved_date, memo: r.memo || "" };
  return m;
}
async function saveItem(id) {
  const p = P(id);
  pending[id] = (pending[id] || 0) + 1;
  setStatus("저장 중…");
  try {
    if (DEMO) { const all = demoStore.load(); all[id] = p; demoStore.save(all); }
    else await rpc("physics_save", { pw, p_item_id: id, p_solved: p.solved, p_unknown: p.unknown,
                                     p_solved_date: p.solved_date || null, p_memo: p.memo || "" });
    setStatus("저장됨 ✓");
  } catch (e) {
    if (e.wrongPw) return logout("비밀번호가 바뀌었어요. 다시 넣어 주세요.");
    setStatus("저장 실패 — 인터넷 연결을 확인하세요", true);
  } finally {
    pending[id]--; if (!pending[id]) delete pending[id];
  }
}
function setStatus(t, err) {
  const el = document.getElementById("status");
  if (el) { el.textContent = t; el.className = "status" + (err ? " err" : ""); }
}

// ===== 계산 =====
function itemsOf(u) { return DATA.items.filter(it => it.unit === DATA.units[u]); }
function countOf(list) {
  let ok = 0, no = 0;
  for (const it of list) { const p = P(it.id); if (p.solved) ok++; if (p.unknown) no++; }
  return { ok, no, total: list.length };
}

// ===== 화면 =====
function bar(label, c, color, extra) {
  return `<div class="bar-row">
    <div class="bar-label"><span>${label}</span>
      <span><span class="ok-text">해결 ${c.ok} / ${c.total}</span> (${pct(c.ok, c.total)}%) · <span class="unk-chip">모름 ${c.no}</span></span></div>
    <div class="bar"><span style="width:${pct(c.ok, c.total)}%;background:${color}"></span></div></div>`;
}

function renderShell() {
  $app.innerHTML = `
    ${DEMO ? `<div class="demo-banner">🧪 <b>연습 모드</b> — 이 화면은 예시예요. 체크한 내용은 이 기기에만 저장되고 서버에는 올라가지 않아요.</div>` : ""}
    <header>
      <h1>${esc(DATA.title)}</h1>
      <span class="status" id="status"></span>
      <button class="iconbtn" id="btnMenu" title="설정">⚙️</button>
    </header>
    <div class="viewtabs">
      <button data-view="list">✅ 체크리스트</button>
      <button data-view="stats">📋 통계</button>
    </div>
    <div id="summary"></div>
    <div id="main"></div>`;
  $app.querySelectorAll(".viewtabs button").forEach(b => b.onclick = () => { view = b.dataset.view; renderAll(); window.scrollTo(0, 0); });
  document.getElementById("btnMenu").onclick = openMenu;
}

function renderSummary() {
  let h = `<div class="card total">${bar("<b>전체 진도</b>", countOf(DATA.items), "#1f2328")}`;
  DATA.units.forEach((u, i) => { h += bar(`<span class="unit-dot" style="background:${UNIT_COLORS[i]}"></span>${esc(u)}`, countOf(itemsOf(i)), UNIT_COLORS[i]); });
  document.getElementById("summary").innerHTML = h + `</div>`;
  document.querySelectorAll(".unittabs button").forEach(b => {
    const c = countOf(itemsOf(+b.dataset.u)); b.querySelector("small").textContent = `${c.ok}/${c.total}`;
  });
  if (view === "list" && document.querySelector("details.std")) refreshStd();
}
function refreshStd() {
  const d = document.querySelector("details.std");
  d.querySelectorAll(".std-row").forEach(el => el.remove());
  for (const { s, c } of stdRows(unitIdx)) d.insertAdjacentHTML("beforeend", stdRowHtml(s, c));
}
function stdRowHtml(s, c) {
  return `<div class="std-row" title="${esc(s.text)}">${bar(`<b>${esc(s.keyword)}</b> <span class="std-code">${esc(s.code)}</span>`, c, UNIT_COLORS[unitIdx])}
      <div class="muted">${esc(s.text)}</div></div>`;
}

function renderAll() {
  $app.querySelectorAll(".viewtabs button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  document.documentElement.style.setProperty("--unit", UNIT_COLORS[unitIdx]);
  renderSummary();
  if (view === "list") renderList(); else renderStats();
}

function stdRows(u) {
  const list = itemsOf(u);
  return DATA.standards.filter(s => s.unit === DATA.units[u]).map(s => {
    const c = countOf(list.filter(it => it.standard === s.code));
    return { s, c };
  });
}

function renderList() {
  const u = unitIdx, color = UNIT_COLORS[u];
  let list = itemsOf(u);
  if (filter === "todo") list = list.filter(it => !P(it.id).solved);
  if (filter === "unknown") list = list.filter(it => P(it.id).unknown);

  let h = `<div class="unittabs">` + DATA.units.map((name, i) => {
      const c = countOf(itemsOf(i)), on = i === u;
      return `<button data-u="${i}" style="border-color:${UNIT_COLORS[i]};${on ? `background:${UNIT_COLORS[i]};color:#fff` : `color:${UNIT_COLORS[i]}`}">
        ${esc(name)}<small>${c.ok}/${c.total}</small></button>`;
    }).join("") + `</div>`;

  h += `<div class="filters">
    <button data-f="all" class="${filter === "all" ? "on" : ""}">전체 보기</button>
    <button data-f="todo" class="${filter === "todo" ? "on" : ""}">안 푼 문항만</button>
    <button data-f="unknown" class="${filter === "unknown" ? "on" : ""}">모름 체크한 문항만</button></div>`;

  h += `<details class="std card" ${localStorage.getItem("std_open") === "1" ? "open" : ""}><summary>성취기준별 진도 (${esc(DATA.units[u])})</summary>`;
  for (const { s, c } of stdRows(u)) h += stdRowHtml(s, c);
  h += `</details>`;

  if (!list.length) {
    h += `<div class="card empty">${filter === "todo" ? "🎉 이 단원은 안 푼 문항이 없어요!" : filter === "unknown" ? "모름으로 체크한 문항이 없어요." : "문항이 없어요."}</div>`;
  } else {
    h += `<table class="items"><thead><tr><th>번호</th><th>성취기준 키워드</th><th>출처</th><th>해결</th><th>모름</th><th>날짜</th><th>메모</th></tr></thead><tbody>`;
    for (const it of list) h += rowHtml(it);
    h += `</tbody></table>`;
  }
  const main = document.getElementById("main");
  main.innerHTML = h;

  main.querySelectorAll(".unittabs button").forEach(b => b.onclick = () => { unitIdx = +b.dataset.u; renderAll(); });
  main.querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; renderList(); });
  main.querySelector("details.std").ontoggle = e => localStorage.setItem("std_open", e.target.open ? "1" : "0");
  const tbody = main.querySelector("tbody");
  if (tbody) bindRows(tbody);
}

function rowHtml(it) {
  const p = P(it.id), std = DATA.standards.find(s => s.code === it.standard);
  return `<tr id="row-${esc(it.id)}" data-id="${esc(it.id)}" class="${p.solved ? "is-ok" : ""} ${p.unknown ? "is-no" : ""}">
    <td class="num">${it.number}</td>
    <td class="kw" title="${esc(std ? std.text : "")}">${esc(it.keyword)}</td>
    <td class="src">${it.source ? esc(it.source) : `<span class="new">새 문항</span>`}</td>
    <td class="ok"><button class="tog ok ${p.solved ? "on" : ""}" data-act="ok" aria-pressed="${p.solved}" aria-label="해결">✓</button><span class="tog-label">해결</span></td>
    <td class="no"><button class="tog no ${p.unknown ? "on" : ""}" data-act="no" aria-pressed="${p.unknown}" aria-label="모름">?</button><span class="tog-label">모름</span></td>
    <td class="date"><input type="date" class="date" data-act="date" value="${esc(p.solved_date || "")}" aria-label="해결 날짜"></td>
    <td class="memo"><input type="text" class="memo" data-act="memo" maxlength="500" placeholder="메모 (예: 다시 풀기)" value="${esc(p.memo)}" aria-label="메모"></td>
  </tr>`;
}

function bindRows(tbody) {
  tbody.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.closest("tr").dataset.id, p = { ...P(id) };
    if (b.dataset.act === "ok") {
      p.solved = !p.solved;
      if (p.solved && !p.solved_date) p.solved_date = today();
      if (!p.solved) p.solved_date = null;
    } else {
      p.unknown = !p.unknown;
    }
    prog[id] = p; saveItem(id);
    renderSummary();
    // 필터 중이면 목록을 다시 그림, 아니면 그 줄만 바꿈
    if (filter !== "all") renderList(); else replaceRow(id);
  });
  tbody.addEventListener("change", e => {
    const inp = e.target, act = inp.dataset.act; if (!act) return;
    const id = inp.closest("tr").dataset.id, p = { ...P(id) };
    if (act === "date") p.solved_date = inp.value || null;
    if (act === "memo") p.memo = inp.value.slice(0, 500);
    prog[id] = p; saveItem(id);
  });
  // 메모: 입력을 멈추면 자동 저장
  let memoTimer = {};
  tbody.addEventListener("input", e => {
    const inp = e.target; if (inp.dataset.act !== "memo") return;
    const id = inp.closest("tr").dataset.id;
    clearTimeout(memoTimer[id]);
    memoTimer[id] = setTimeout(() => {
      if (P(id).memo === inp.value) return;
      prog[id] = { ...P(id), memo: inp.value.slice(0, 500) }; saveItem(id);
    }, 1200);
  });
}

function replaceRow(id) {
  const tr = document.getElementById("row-" + id); if (!tr) return;
  const it = DATA.items.find(x => x.id === id);
  const tmp = document.createElement("tbody"); tmp.innerHTML = rowHtml(it);
  tr.replaceWith(tmp.firstElementChild);
}

function renderStats() {
  let h = `<div class="card"><h2>단원별 통계</h2><table class="stat">
    <thead><tr><th>단원</th><th>전체</th><th>해결</th><th>모름</th><th>모름 비율</th></tr></thead><tbody>`;
  let T = { ok: 0, no: 0, total: 0 };
  DATA.units.forEach((u, i) => {
    const c = countOf(itemsOf(i)); T.ok += c.ok; T.no += c.no; T.total += c.total;
    h += `<tr><td><span class="unit-dot" style="background:${UNIT_COLORS[i]}"></span>${esc(u)}</td>
      <td>${c.total}</td><td class="ok-text">${c.ok}</td><td class="unk-chip">${c.no}</td><td>${pct(c.no, c.total)}%</td></tr>`;
  });
  h += `<tr class="sum"><td>합계</td><td>${T.total}</td><td>${T.ok}</td><td>${T.no}</td><td>${pct(T.no, T.total)}%</td></tr></tbody></table>
    <p class="muted">모름 비율 = 모름 수 ÷ 단원 문항 수</p></div>`;

  DATA.units.forEach((u, i) => {
    const rows = stdRows(i).sort((a, b) => b.c.no - a.c.no || a.s.code.localeCompare(b.s.code));
    const unk = itemsOf(i).filter(it => P(it.id).unknown);
    h += `<div class="card stat-unit" style="border-top:5px solid ${UNIT_COLORS[i]}">
      <h3 style="color:${UNIT_COLORS[i]}">${esc(u)} — 성취기준별 모름</h3>
      <table class="stat"><thead><tr><th>성취기준</th><th>문항</th><th>해결</th><th>모름</th></tr></thead><tbody>
      ${rows.map(({ s, c }) => `<tr><td><b>${esc(s.keyword)}</b><br><span class="std-code">${esc(s.code)}</span></td>
        <td>${c.total}</td><td class="ok-text">${c.ok}</td><td class="unk-chip">${c.no}</td></tr>`).join("")}
      </tbody></table>
      <div style="margin-top:12px"><b>모름 문항 번호</b> <span class="muted">(누르면 그 문항으로 이동)</span></div>
      <div class="numlinks">${unk.length ? unk.map(it => `<button data-go="${esc(it.id)}">${it.number}</button>`).join("") : `<span class="muted">없음</span>`}</div>
    </div>`;
  });
  const main = document.getElementById("main");
  main.innerHTML = h;
  main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goTo(b.dataset.go));
}

function goTo(id) {
  const it = DATA.items.find(x => x.id === id);
  view = "list"; unitIdx = DATA.units.indexOf(it.unit);
  if (filter === "todo" && P(id).solved) filter = "all";
  renderAll();
  const tr = document.getElementById("row-" + id);
  if (tr) { tr.scrollIntoView({ behavior: "smooth", block: "center" }); tr.classList.add("hl"); setTimeout(() => tr.classList.remove("hl"), 2100); }
}

// ===== 다른 사람이 바꾼 내용 받아오기 =====
async function poll() {
  if (document.hidden) return;
  try {
    const server = await fetchAll();
    let changed = [];
    const ids = new Set([...Object.keys(server), ...Object.keys(prog)]);
    for (const id of ids) {
      if (pending[id]) continue;
      const a = JSON.stringify(P(id)), s = server[id] || { solved: false, unknown: false, solved_date: null, memo: "" };
      if (a !== JSON.stringify({ solved: s.solved, unknown: s.unknown, solved_date: s.solved_date, memo: s.memo })) {
        prog[id] = { solved: s.solved, unknown: s.unknown, solved_date: s.solved_date, memo: s.memo };
        changed.push(id);
      }
    }
    if (changed.length) {
      const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest("tr[data-id]");
      renderSummary();
      if (view === "stats") renderStats();
      else if (focused || filter === "all") changed.forEach(id => { if (!focused || focused.dataset.id !== id) replaceRow(id); });
      else renderList();
    }
    if (!Object.keys(pending).length) setStatus(DEMO ? "연습 모드" : "최신 상태 ✓");
  } catch (e) {
    if (e.wrongPw) return logout("비밀번호가 바뀌었어요. 다시 넣어 주세요.");
    setStatus("연결 끊김 — 다시 시도 중", true);
  }
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  window.addEventListener("focus", poll);
}

// ===== 로그인 =====
function renderLogin(msg, setup) {
  $app.innerHTML = `<div class="card login">
    <h2 style="font-size:20px">${esc(DATA ? DATA.title : "물리 기출 진도 체크리스트")}</h2>
    ${setup ? `<p>처음 사용이에요. <b>선생님과 학생이 같이 쓸 비밀번호</b>를 정해 주세요 (4글자 이상).</p>
      <input type="password" id="pw1" placeholder="새 비밀번호" autocomplete="new-password">
      <input type="password" id="pw2" placeholder="한 번 더" autocomplete="new-password">`
    : `<p>비밀번호를 넣어 주세요. 한 번 넣으면 이 기기에서는 다음부터 자동으로 들어가요.</p>
      <input type="password" id="pw1" placeholder="비밀번호" autocomplete="current-password">`}
    <div class="msg" id="msg">${esc(msg || "")}</div>
    <button class="main" id="go">${setup ? "비밀번호 정하고 시작" : "들어가기"}</button></div>`;
  const go = async () => {
    const v = document.getElementById("pw1").value, m = document.getElementById("msg");
    m.textContent = "확인 중…";
    try {
      if (setup) {
        if (v !== document.getElementById("pw2").value) { m.textContent = "두 비밀번호가 달라요."; return; }
        const r = await rpc("physics_set_first_password", { new_pw: v });
        if (!r.ok) { m.textContent = r.error; return; }
      } else {
        const r = await rpc("physics_login", { pw: v });
        if (r.needs_setup) return renderLogin("", true);
        if (!r.ok) { m.textContent = "비밀번호가 틀렸어요."; return; }
      }
      pw = v; localStorage.setItem(PW_KEY, v); start();
    } catch (e) { m.textContent = "서버에 연결할 수 없어요. 인터넷을 확인해 주세요."; }
  };
  document.getElementById("go").onclick = go;
  $app.querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
  document.getElementById("pw1").focus();
}
function logout(msg) { localStorage.removeItem(PW_KEY); pw = ""; clearInterval(pollTimer); renderLogin(msg); }

function openMenu() {
  const choice = prompt(DEMO ? "연습 모드입니다.\n1 = 연습 체크 모두 지우기\n(취소 = 닫기)"
                             : "설정\n1 = 이 기기에서 로그아웃\n2 = 비밀번호 바꾸기\n(취소 = 닫기)");
  if (choice === "1") {
    if (DEMO) { if (confirm("연습으로 체크한 내용을 모두 지울까요?")) { demoStore.save({}); prog = {}; renderAll(); } }
    else logout("로그아웃했어요.");
  } else if (choice === "2" && !DEMO) {
    const n1 = prompt("새 비밀번호 (4글자 이상)"); if (!n1) return;
    const n2 = prompt("새 비밀번호 한 번 더"); if (n1 !== n2) return alert("두 비밀번호가 달라요.");
    rpc("physics_change_password", { old_pw: pw, new_pw: n1 }).then(r => {
      if (!r.ok) return alert(r.error);
      pw = n1; localStorage.setItem(PW_KEY, n1);
      alert("비밀번호를 바꿨어요. 상대방에게도 새 비밀번호를 알려 주세요.");
    }).catch(() => alert("서버에 연결할 수 없어요."));
  }
}

async function start() {
  try { prog = await fetchAll(); }
  catch (e) {
    if (e.wrongPw) return logout("비밀번호를 다시 넣어 주세요.");
    $app.innerHTML = `<div class="card empty">서버에 연결할 수 없어요. 인터넷을 확인하고 새로고침해 주세요.</div>`; return;
  }
  renderShell(); renderAll(); setStatus(DEMO ? "연습 모드" : "최신 상태 ✓"); startPolling();
}

(async function init() {
  try { DATA = await (await fetch("checklist_data.json", { cache: "no-cache" })).json(); }
  catch (e) { $app.innerHTML = `<div class="card empty">문항 파일(checklist_data.json)을 불러오지 못했어요.</div>`; return; }
  if (DEMO || pw) start(); else renderLogin();
})();
</script>
